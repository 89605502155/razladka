[project]
name = "razladka"
version = "0.1.0"
description = "Generate synthetic time series with a given number of change points (Markov regime switching, Weierstrass–Mandelbrot roughness) with ground-truth labels, saved to CSV, Parquet, HDF5, NetCDF, Trosna and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Ferubko", email = "ferubko1999@yandex.ru" }
]
requires-python = ">=3.11"
keywords = [
    "time-series",
    "change-point",
    "change-point-detection",
    "synthetic-data",
    "data-generation",
    "regime-switching",
    "markov",
    "weierstrass",
    "fractal",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1"]
polars = ["polars>=1.0"]
arrow = ["pyarrow>=15"]
hdf5 = ["h5py>=3.10"]
netcdf = ["h5netcdf>=1.3"]
excel = ["openpyxl>=3.1"]
trosna = ["pytrosna>=0.1.0"]
tsfile = ["tsfile>=2.4", "pandas>=2.1"]
all = [
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=15",
    "h5py>=3.10",
    "h5netcdf>=1.3",
    "openpyxl>=3.1",
    "pytrosna>=0.1.0",
    "tsfile>=2.4",
]

[project.urls]
Homepage = "https://github.com/89605502155/razladka"
Documentation = "https://github.com/89605502155/razladka/tree/main/docs"
Repository = "https://github.com/89605502155/razladka"
Issues = "https://github.com/89605502155/razladka/issues"
Changelog = "https://github.com/89605502155/razladka/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "razladka[all]",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
# The source distribution also carries the tests, documentation and examples.
source-include = ["tests/**", "docs/**", "examples/**", "README.ru.md", "CHANGELOG.md"]

[tool.uv]
# pyarrow 26 has no CPython 3.14 wheels yet; the development environment
# uses the newest release that has them.
constraint-dependencies = ["pyarrow<26 ; python_full_version >= '3.14'"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "ISC",  # implicit string concatenation
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "T20",  # no print in the library
    "PERF", # performance anti-patterns
    "PL",   # pylint
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
]
ignore = [
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments: generate() mirrors the documented API
    "PLR0915", # too many statements
    "PLR2004", # magic values: constants are documented in docs/guide.md
    "PLC0415", # imports inside functions keep optional dependencies optional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603", "PLR2004", "PLR0917", "T20", "PLC0415", "N802", "PERF", "PT012", "S311", "RUF001", "RUF003"]
"examples/**" = ["T20", "S101", "S108", "RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["razladka"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--doctest-modules", "--import-mode=importlib", "-m", "not slow"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "slow: long-running, memory-hungry tests (10^8 points needs ~2 GB of RAM); run with -m slow",
    "interop: tests against the reference Rust trosna CLI (skipped if TROSNA_CLI is not set)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["razladka"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.mypy]
python_version = "3.11"
files = ["src/razladka"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
